<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <h1>Mohamed Ali Admin</h1>
    <p class="subtitle">Sign in to your workspace</p>

    <label for="email">Email Address</label>
    <div class="input-wrapper">
      <span class="input-icon">✉</span>
      <input id="email" type="email" formControlName="email" autocomplete="username" placeholder="admin@example.com" />
    </div>
    @if (form.get('email')?.touched && form.get('email')?.invalid) {
      <span class="field-error">Enter a valid email.</span>
    }

    <label for="password">Password</label>
    <div class="input-wrapper">
      <span class="input-icon">🔒</span>
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
      />
      <button type="button" class="toggle-visibility" (click)="togglePasswordVisibility()">
        {{ showPassword() ? '🙈' : '👁' }}
      </button>
    </div>
    @if (form.get('password')?.touched && form.get('password')?.invalid) {
      <span class="field-error">Password is required.</span>
    }

    @if (errorMessage()) {
      <div class="form-error">{{ errorMessage() }}</div>
    }

    <button type="submit" class="submit-btn" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Signing in...' : 'Sign In →' }}
    </button>

    <div class="card-footer">
      <a routerLink="/admin/forgot-password">Forgot password?</a>
    </div>
  </form>
</div>
