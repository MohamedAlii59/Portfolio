<div class="dashboard">
  <aside class="sidebar">
    <div class="sidebar-top">
      @if (profilePhotoUrl()) {
        <img [src]="profilePhotoUrl()" alt="Profile" class="avatar" />
      } @else {
        <div class="avatar avatar-placeholder">{{ fullName?.charAt(0) }}</div>
      }
      <div class="user-name">{{ fullName }}</div>
      <div class="user-role">Software Engineer</div>
    </div>

    <nav>
      <a routerLink="profile" routerLinkActive="active">
        <span class="nav-icon">👤</span> Profile
      </a>
      <a routerLink="projects" routerLinkActive="active">
        <span class="nav-icon">📁</span> Projects
      </a>
      <a routerLink="education" routerLinkActive="active">
        <span class="nav-icon">🎓</span> Education
      </a>
      <a routerLink="experience" routerLinkActive="active">
        <span class="nav-icon">💼</span> Experience
      </a>
      <a routerLink="technologies" routerLinkActive="active">
        <span class="nav-icon">🧩</span> Technologies
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a class="view-site-btn" [href]="'/u/' + slug" target="_blank">View public site</a>
      <button class="logout-btn" (click)="logout()">↩ Log Out</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
